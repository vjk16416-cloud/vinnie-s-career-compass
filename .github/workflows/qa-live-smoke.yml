name: QA Live Smoke

on:
  push:
    branches:
      - agent/release-candidate-qa-2026-08-22
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://agent-release-candidate-qa-2026-08-22-vinnie-s-career-compass.vjk16416.workers.dev
    steps:
      - name: Wait for Cloudflare branch preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            code=$(curl -sS -L -o /tmp/root.html -w '%{http_code}' "$BASE_URL/" || true)
            if [ "$code" = "200" ] && grep -q "CareerOS" /tmp/root.html; then
              echo "Preview is ready on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $code, waiting for preview deployment"
            sleep 5
          done
          echo "Cloudflare branch preview did not become ready"
          exit 1

      - name: Verify Google-only login surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/" -o /tmp/login.html
          grep -q "CareerOS" /tmp/login.html
          grep -q "Private career workspace" /tmp/login.html
          grep -q "Sign in with Google" /tmp/login.html
          grep -q "Access is limited to vjk16416@gmail.com" /tmp/login.html
          if grep -Eqi 'type=["'"']password["'"']|magic link|sign up' /tmp/login.html; then
            echo "Unexpected non-Google authentication control found"
            exit 1
          fi

      - name: Verify protected routes do not expose private workspace while signed out
        shell: bash
        run: |
          set -euo pipefail
          for path in /applications /job-scan /cvs /profile /evidence /settings; do
            code=$(curl -sS -L -o /tmp/protected.html -w '%{http_code}' "$BASE_URL$path")
            test "$code" = "200"
            grep -q "CareerOS" /tmp/protected.html
            grep -q "Sign in with Google" /tmp/protected.html
            if grep -q "Application tracking" /tmp/protected.html; then
              echo "Private application content was visible while signed out at $path"
              exit 1
            fi
            echo "$path protected successfully"
          done

      - name: Verify no obvious server failure markers
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$BASE_URL/" -o /tmp/root.html
          if grep -Eqi 'Internal Server Error|Application error|Unhandled Runtime Error|502 Bad Gateway|503 Service Unavailable' /tmp/root.html; then
            echo "Server failure marker found in rendered page"
            exit 1
          fi
