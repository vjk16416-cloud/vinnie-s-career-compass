# CareerOS branch verification
name: Verify

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format PR files
        if: github.event_name == 'push'
        run: |
          bunx prettier --write \
            src/components/careeros/app-shell.tsx \
            src/components/careeros/cv-health-check-panel.test.tsx \
            src/components/careeros/cv-health-check-panel.tsx \
            src/components/careeros/evidence-review-panel.tsx \
            src/lib/auth/oauth.functions.test.ts \
            src/lib/auth/oauth.functions.ts \
            src/lib/careeros/cloud-bootstrap.test.ts \
            src/lib/careeros/cloud-bootstrap.ts \
            src/lib/careeros/cloud-state.repository.test.ts \
            src/lib/careeros/cloud-state.repository.ts \
            src/lib/careeros/evidence-map.ts \
            src/lib/careeros/generate.profile.test.ts \
            src/lib/careeros/generic-requirements.ts \
            src/lib/careeros/job-extract.functions.ts \
            src/lib/careeros/job-extract.server.test.ts \
            src/lib/careeros/job-extract.server.ts \
            src/lib/careeros/local-cache.ts \
            src/lib/careeros/ordered-save-queue.test.ts \
            src/lib/careeros/ordered-save-queue.ts \
            src/lib/careeros/profile-claim-variants.ts \
            src/lib/careeros/profile-coverage.ts \
            src/lib/careeros/profile-data.master.test.ts \
            src/lib/careeros/profile-data.ts \
            src/lib/careeros/profile-extraction.test.ts \
            src/lib/careeros/profile-extraction.ts \
            src/lib/careeros/profile-foundation.test.ts \
            src/lib/careeros/profile-foundation.ts \
            src/lib/careeros/profile-post-audit.ts \
            src/lib/careeros/profile-reconciled-items.ts \
            src/lib/careeros/profile-review.test.ts \
            src/lib/careeros/profile-review.ts \
            src/lib/careeros/scoring.evidence-map.test.ts \
            src/lib/careeros/scoring.ts \
            src/lib/careeros/store.cloud.test.tsx \
            src/lib/careeros/store.tsx \
            src/lib/careeros/types.ts \
            src/routes/-job-scan.test.tsx \
            src/routes/applications.\$id.tsx \
            src/routes/job-scan.tsx \
            src/routes/profile.tsx \
            src/lib/cloudflare/wrangler-config.test.ts \
            src/integrations/supabase/auth-attacher.ts \
            src/integrations/supabase/auth-middleware.ts \
            src/integrations/supabase/client.server.ts \
            src/integrations/supabase/client.ts \
            src/integrations/supabase/types.ts \
            src/lib/mcp/tools/extract-job-posting.ts \
            src/lib/mcp/tools/list-evidence.ts \
            'src/routes/[.]lovable.oauth.consent.tsx' \
            'src/routes/[.mcp]/invoke-tool/$tool.ts' \
            'src/routes/[.mcp]/list-tools.ts' \
            'src/routes/[.well-known]/oauth-protected-resource.ts' \
            src/routes/mcp.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/components/careeros/app-shell.tsx \
              src/components/careeros/cv-health-check-panel.test.tsx \
              src/components/careeros/cv-health-check-panel.tsx \
              src/components/careeros/evidence-review-panel.tsx \
              src/lib/auth/oauth.functions.test.ts \
              src/lib/auth/oauth.functions.ts \
              src/lib/careeros/cloud-bootstrap.test.ts \
              src/lib/careeros/cloud-bootstrap.ts \
              src/lib/careeros/cloud-state.repository.test.ts \
              src/lib/careeros/cloud-state.repository.ts \
              src/lib/careeros/evidence-map.ts \
              src/lib/careeros/generate.profile.test.ts \
              src/lib/careeros/generic-requirements.ts \
              src/lib/careeros/job-extract.functions.ts \
              src/lib/careeros/job-extract.server.test.ts \
              src/lib/careeros/job-extract.server.ts \
              src/lib/careeros/local-cache.ts \
              src/lib/careeros/ordered-save-queue.test.ts \
              src/lib/careeros/ordered-save-queue.ts \
              src/lib/careeros/profile-claim-variants.ts \
              src/lib/careeros/profile-coverage.ts \
              src/lib/careeros/profile-data.master.test.ts \
              src/lib/careeros/profile-data.ts \
              src/lib/careeros/profile-extraction.test.ts \
              src/lib/careeros/profile-extraction.ts \
              src/lib/careeros/profile-foundation.test.ts \
              src/lib/careeros/profile-foundation.ts \
              src/lib/careeros/profile-post-audit.ts \
              src/lib/careeros/profile-reconciled-items.ts \
              src/lib/careeros/profile-review.test.ts \
              src/lib/careeros/profile-review.ts \
              src/lib/careeros/scoring.evidence-map.test.ts \
              src/lib/careeros/scoring.ts \
              src/lib/careeros/store.cloud.test.tsx \
              src/lib/careeros/store.tsx \
              src/lib/careeros/types.ts \
              src/routes/-job-scan.test.tsx \
              src/routes/applications.\$id.tsx \
              src/routes/job-scan.tsx \
              src/routes/profile.tsx \
              src/lib/cloudflare/wrangler-config.test.ts \
              src/integrations/supabase/auth-attacher.ts \
              src/integrations/supabase/auth-middleware.ts \
              src/integrations/supabase/client.server.ts \
              src/integrations/supabase/client.ts \
              src/integrations/supabase/types.ts \
              src/lib/mcp/tools/extract-job-posting.ts \
              src/lib/mcp/tools/list-evidence.ts \
              'src/routes/[.]lovable.oauth.consent.tsx' \
              'src/routes/[.mcp]/invoke-tool/$tool.ts' \
              'src/routes/[.mcp]/list-tools.ts' \
              'src/routes/[.well-known]/oauth-protected-resource.ts' \
              src/routes/mcp.ts
            git commit -m "Format verification files"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Record verified commit
        run: git rev-parse HEAD

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Run build
        run: bun run build
