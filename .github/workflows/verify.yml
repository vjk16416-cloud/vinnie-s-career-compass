# CareerOS branch verification
name: Verify

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format PR files
        if: github.event_name == 'push'
        run: |
          bunx prettier --write \
            src/lib/careeros/profile-data.ts \
            src/lib/careeros/profile-foundation.test.ts \
            src/lib/careeros/profile-foundation.ts \
            src/routes/profile.tsx \
            src/lib/cloudflare/wrangler-config.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/lib/careeros/profile-data.ts \
              src/lib/careeros/profile-foundation.test.ts \
              src/lib/careeros/profile-foundation.ts \
              src/routes/profile.tsx \
              src/lib/cloudflare/wrangler-config.test.ts
            git commit -m "Format verification files"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Record verified commit
        run: git rev-parse HEAD

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Run build
        run: bun run build
