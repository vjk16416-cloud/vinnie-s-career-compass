name: Verify auth hotfix

on:
  push:
    branches:
      - agent/google-auth-hotfix

permissions:
  contents: read

jobs:
  verify-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Lint auth hotfix files
        run: >-
          bunx eslint
          src/lib/auth/config.ts
          src/lib/auth/config.test.ts
          src/lib/auth/route-guard.ts
          src/lib/auth/route-guard.test.ts
          src/components/auth/login-card.tsx
          src/components/auth/login-card.test.tsx

      - name: Build production app
        run: bun run build
