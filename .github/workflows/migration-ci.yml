name: CareerOS Migration CI

on:
  push:
    branches:
      - migration/independent-careeros-web
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bootstrap Task 1 once
        shell: bash
        run: |
          if node -e 'const p=require("./package.json"); process.exit(p.scripts?.test ? 0 : 1)'; then
            echo "Task 1 build baseline already exists."
            exit 0
          fi

          bun add --dev --exact vitest @testing-library/react @testing-library/jest-dom jsdom
          bun remove @lovable.dev/vite-tanstack-config
          bun -e 'const p = await Bun.file("package.json").json(); p.scripts.test = "vitest run"; p.scripts["test:watch"] = "vitest"; await Bun.write("package.json", JSON.stringify(p, null, 2) + "\n")'

          cat > vite.config.ts <<'EOF'
          import { tanstackStart } from "@tanstack/react-start/plugin/vite";
          import tailwindcss from "@tailwindcss/vite";
          import viteReact from "@vitejs/plugin-react";
          import { nitro } from "nitro/vite";
          import { defineConfig } from "vite";
          import tsConfigPaths from "vite-tsconfig-paths";

          export default defineConfig({
            plugins: [
              tsConfigPaths(),
              tanstackStart(),
              nitro({ preset: "cloudflare_module" }),
              viteReact(),
              tailwindcss(),
            ],
          });
          EOF

          cat > vitest.config.ts <<'EOF'
          import { defineConfig } from "vitest/config";
          import tsconfigPaths from "vite-tsconfig-paths";

          export default defineConfig({
            plugins: [tsconfigPaths()],
            test: {
              environment: "jsdom",
              setupFiles: ["./src/test/setup.ts"],
              clearMocks: true,
            },
          });
          EOF

          mkdir -p src/test
          cat > src/test/setup.ts <<'EOF'
          import "@testing-library/jest-dom/vitest";
          EOF

          cat > .env.example <<'EOF'
          VITE_SUPABASE_URL=
          VITE_SUPABASE_PUBLISHABLE_KEY=
          EOF

          if ! grep -q '^# Local environment files$' .gitignore; then
            printf '\n# Local environment files\n.env\n.env.local\n.env.*.local\n!.env.example\n' >> .gitignore
          fi

          bun run test -- --passWithNoTests
          bun run lint
          bun run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock vite.config.ts vitest.config.ts src/test/setup.ts .env.example .gitignore
          git commit -m "build: remove production Lovable build dependency"
          git push origin HEAD:migration/independent-careeros-web

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --passWithNoTests

      - name: Run lint
        run: bun run lint

      - name: Build application
        run: bun run build
