name: CareerOS Migration CI

on:
  push:
    branches:
      - migration/independent-careeros-web
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --passWithNoTests

      - name: Run lint
        run: bun run lint

      - name: Build application
        run: bun run build
