name: CareerOS Migration CI

on:
  push:
    branches:
      - migration/independent-careeros-web
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify no tracked local env
        shell: bash
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must not be tracked. Use .env.example plus runtime environment configuration."
            exit 1
          fi

      - name: Audit committed secret values
        shell: bash
        run: |
          echo "Reviewing sensitive identifier references:"
          git grep -nE '(service_role|SUPABASE_SERVICE|sb_secret_|client_secret)' -- ':!docs/superpowers/plans/*' || true

          if git grep -nE 'sb_secret_[A-Za-z0-9_-]{16,}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*["'"'"'][^$"'"'"'][^"'"'"']{7,}["'"'"']|client_secret[[:space:]]*[:=][[:space:]]*["'"'"'][^$"'"'"'][^"'"'"']{7,}["'"'"']' -- ':!docs/superpowers/plans/*'; then
            echo "::error::Potential committed secret value detected."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --passWithNoTests

      - name: Verify canonical migration dry run
        run: bun run migrate:vinnie:dry-run

      - name: Run lint
        run: bun run lint

      - name: Build application
        run: bun run build
