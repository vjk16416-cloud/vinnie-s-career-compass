name: CareerOS positioning verification

on:
  push:
    branches:
      - careeros-data-sync

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tests
        run: bun test
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Lint changed CareerOS files
        run: >-
          bunx eslint
          src/lib/careeros/types.ts
          src/lib/careeros/seed.ts
          src/lib/careeros/normalise.ts
          src/lib/careeros/normalise.test.ts
          src/lib/careeros/generate.ts
          src/lib/careeros/generate.test.ts
      - name: Build
        run: bun run build
