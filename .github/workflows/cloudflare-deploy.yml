name: CareerOS Cloudflare Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: migration/independent-careeros-web

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run lint
        run: bun run lint

      - name: Build CareerOS
        env:
          VITE_SUPABASE_URL: https://gieehxdyzcrrmgxnfsxs.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.CAREEROS_SUPABASE_PUBLISHABLE_KEY }}
        run: bun run build

      - name: Deploy preview to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
