name: CareerOS data sync verification

on:
  push:
    branches:
      - careeeros-data-sync
      - careeros-data-sync

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Format changed CareerOS files
        run: >-
          bunx prettier --write
          src/lib/careeros/types.ts
          src/lib/careeros/seed.ts
          src/lib/careeros/normalise.ts
          src/lib/careeros/normalise.test.ts
          src/lib/careeros/generate.ts
          src/lib/careeros/generate.test.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet -- src/lib/careeros; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/careeros/types.ts src/lib/careeros/seed.ts src/lib/careeros/normalise.ts src/lib/careeros/normalise.test.ts src/lib/careeros/generate.ts src/lib/careeros/generate.test.ts
            git commit -m "style: format CareerOS data sync"
            git push
          fi
      - name: Focused tests
        run: bun test src/lib/careeros/normalise.test.ts src/lib/careeros/generate.test.ts
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Lint changed CareerOS files
        run: >-
          bunx eslint
          src/lib/careeros/types.ts
          src/lib/careeros/seed.ts
          src/lib/careeros/normalise.ts
          src/lib/careeros/normalise.test.ts
          src/lib/careeros/generate.ts
          src/lib/careeros/generate.test.ts
      - name: Build
        run: bun run build
