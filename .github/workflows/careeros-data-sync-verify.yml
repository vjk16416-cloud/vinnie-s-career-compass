name: CareerOS data sync verification

on:
  push:
    branches:
      - careeros-data-sync

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused tests
        run: bun test src/lib/careeros/normalise.test.ts src/lib/careeros/generate.test.ts
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
